openapi: 3.0.3
info:
  title: LOA VERICERT — Cert Platform API
  description: |
    Client-side SPA API for LOA VERICERT certificate management.
    All operations are client-side via `/api/v1/*` Vercel rewrite.
    Bearer token auth via in-memory access token (JWT).
  version: "2.0"
  contact:
    name: Lyceum Alabang Vericert
servers:
  - url: https://api.certplatform.vercel.app/v1
    description: Production Cert API
  - url: http://localhost:3001/api/v1
    description: Mock Cert API (local dev)
security:
  - BearerAuth: []
paths:
  /auth/tokens:
    post:
      summary: Direct token issuance (bypass SSO, for testing)
      operationId: getAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/refresh:
    post:
      summary: Refresh access token using httpOnly cookie
      operationId: refreshToken
      security: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: Logout and clear refresh cookie
      operationId: logout
      responses:
        "204":
          description: Logged out
  /events:
    get:
      summary: List events with pagination and filters
      operationId: listEvents
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: statuses
          in: query
          schema:
            type: string
            description: Comma-separated status filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - events
    post:
      summary: Create a new event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - events
  /events/{id}:
    get:
      summary: Get event by ID
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
    patch:
      summary: Update event
      operationId: updateEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartialEvent"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
    delete:
      summary: Delete event
      operationId: deleteEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Event deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
  /events/{id}/stats:
    get:
      summary: Get event statistics
      operationId: getEventStats
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
  /events/{id}/clone-template:
    post:
      summary: Clone event certificate template
      operationId: cloneTemplate
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody: {}
      responses:
        "201":
          description: Cloned template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
  /events/{id}/clone-email-template:
    post:
      summary: Clone event email template
      operationId: cloneEmailTemplate
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody: {}
      responses:
        "201":
          description: Cloned email template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - events
  /events/{id}/attendees:
    get:
      summary: List event attendees
      operationId: listAttendees
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated attendee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - attendees
    post:
      summary: Add attendee to event
      operationId: addAttendee
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttendeeInput"
      responses:
        "201":
          description: Attendee added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - attendees
  /events/{id}/attendees/import:
    post:
      summary: Bulk import attendees
      operationId: bulkImportAttendees
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeImport"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - attendees
  /events/{id}/attendees/issue-completed:
    post:
      summary: Issue certificates for completed attendees
      operationId: issueCompleted
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send_email:
                  type: boolean
                  default: false
                attendee_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Issue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCompletedResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - attendees
  /attendees/{id}/delete-preview:
    get:
      summary: Preview attendee deletion impact
      operationId: getDeletePreview
      parameters:
        - $ref: "#/components/parameters/AttendeeId"
      responses:
        "200":
          description: Delete preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeeDeletePreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - attendees
  /attendees/{id}/file-data:
    get:
      summary: Get attendee file data
      operationId: getFileData
      parameters:
        - $ref: "#/components/parameters/AttendeeId"
      responses:
        "200":
          description: File data
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_data:
                    type: string
                  file_name:
                    type: string
                  file_type:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - attendees
  /attendees/{id}/with-cert:
    delete:
      summary: Delete attendee and revoke certificate
      operationId: removeAttendeeWithCert
      parameters:
        - $ref: "#/components/parameters/AttendeeId"
      responses:
        "204":
          description: Attendee and certificate deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - attendees
  /certificates:
    get:
      summary: List certificates
      operationId: listCertificates
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
        - name: with_event
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Certificate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
    post:
      summary: Issue a certificate
      operationId: issueCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCertificateInput"
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
  /certificates/{id}:
    get:
      summary: Get certificate by ID
      operationId: getCertificate
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
    delete:
      summary: Delete certificate
      operationId: deleteCertificate
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "204":
          description: Certificate deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
  /certificates/{id}/revoke:
    patch:
      summary: Revoke a certificate
      operationId: revokeCertificate
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Certificate revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
  /certificates/{id}/pdf:
    get:
      summary: Download certificate PDF
      operationId: downloadCertificatePdf
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
  /certificates/{id}/email:
    post:
      summary: Send certificate email
      operationId: sendCertificateEmail
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
  /certificates/{id}/email-logs:
    get:
      summary: Get certificate email logs
      operationId: getCertificateEmailLogs
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
  /certificates/{certificateNumber}/qr:
    get:
      summary: Get certificate QR code
      operationId: getCertificateQr
      parameters:
        - name: certificateNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR code data URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_url:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - certificates
  /certificates/bulk:
    post:
      summary: Bulk issue certificates
      operationId: bulkIssueCertificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIssueInput"
      responses:
        "200":
          description: Bulk issue results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIssueResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
  /certificates/upload:
    post:
      summary: Upload certificate file
      operationId: uploadCertificate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - organization_id
                - certificate_number
              properties:
                file:
                  type: string
                  format: binary
                organization_id:
                  type: string
                certificate_number:
                  type: string
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_path:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
  /certificates/mine:
    get:
      summary: Get current user's certificates
      operationId: getMyCertificates
      responses:
        "200":
          description: User's certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - certificates
  /templates:
    get:
      summary: List templates
      operationId: listTemplates
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum:
              - certificate
              - email
              - auth
        - name: with_lock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - templates
    post:
      summary: Create a template
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateInput"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - templates
  /templates/{id}:
    get:
      summary: Get template by ID
      operationId: getTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - templates
    patch:
      summary: Update template
      operationId: updateTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartialTemplate"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - templates
    delete:
      summary: Delete template
      operationId: deleteTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "204":
          description: Template deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - templates
  /templates/{id}/lock-state:
    get:
      summary: Check template lock state
      operationId: getTemplateLockState
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Lock state
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_locked:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - templates
  /dashboard/stats:
    get:
      summary: Get dashboard statistics
      operationId: getDashboardStats
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - dashboard
  /dashboard/activity:
    get:
      summary: Get recent activity
      operationId: getRecentActivity
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - dashboard
  /admin/audit-logs:
    get:
      summary: List audit logs with filters
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            enum:
              - ui
              - api
              - workflow
              - system
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: export
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - audit
  /admin/audit-logs/export:
    get:
      summary: Export audit logs as CSV
      operationId: exportAuditLogs
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - audit
  /admin/audit-logs/by-ids:
    post:
      summary: Get audit logs by IDs
      operationId: getAuditLogsByIds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - audit
  /admin/audit-logs/delete:
    post:
      summary: Delete audit logs by IDs
      operationId: deleteAuditLogsByIds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - audit
  /verify/{certificate_number}:
    get:
      summary: Public certificate verification
      operationId: verifyCertificate
      security: []
      parameters:
        - name: certificate_number
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - verify
  /view/{id}:
    get:
      summary: Public certificate view
      operationId: viewCertificate
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certificate view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewResult"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - verify
